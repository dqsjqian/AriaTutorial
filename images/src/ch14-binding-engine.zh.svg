<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 614" width="1120" height="614" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="614" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">绑定更新走哪条路，由派发策略决定</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">上面是三条路径的时间线，下面是绑定方法速查表</text><rect x="24" y="96" width="1072" height="246" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="46" y="114" width="97" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="94.5" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">三种派发策略</text><text x="46" y="178" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">绑定后</text><text x="46" y="228" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">改值后立刻</text><text x="46" y="278" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">pump 1 条后</text><line x1="300" y1="158" x2="300" y2="296" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="560" y1="158" x2="560" y2="296" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="830" y1="158" x2="830" y2="296" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/><text x="46" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Direct</text><text x="46" y="180" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#94a3b8" text-anchor="start">同步、立刻执行</text><rect x="260" y="150" width="80" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="300" y="170" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">1</text><rect x="520" y="150" width="80" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="560" y="170" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">42</text><rect x="790" y="150" width="80" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="830" y="170" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">42</text><text x="46" y="214" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">SmartMarshal</text><text x="46" y="230" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#94a3b8" text-anchor="start">同线程直接，跨线程投递</text><rect x="260" y="200" width="80" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="300" y="220" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">1</text><rect x="520" y="200" width="80" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="560" y="220" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">42</text><rect x="790" y="200" width="80" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="830" y="220" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">42</text><text x="46" y="264" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">AlwaysPost</text><text x="46" y="280" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#94a3b8" text-anchor="start">总是投递到队列</text><rect x="260" y="250" width="80" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="300" y="270" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">1</text><rect x="520" y="250" width="80" height="32" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/><text x="560" y="270" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">1</text><rect x="790" y="250" width="80" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="830" y="270" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">42</text><text x="560" y="322" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle">AlwaysPost 在「改值后立刻」仍是 1 —— 更新还在队列里，没有偷偷同步执行。</text><text x="24" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">绑定方法速查（本章 demo 逐个跑过）</text><rect x="24" y="392" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="40" y="416" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_text</text><text x="286" y="416" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">文本双向</text><rect x="574" y="392" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="590" y="416" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_int / bind_double</text><text x="836" y="416" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">数值双向</text><rect x="24" y="436" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="40" y="460" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_text_projected</text><text x="286" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">单向投影：VM → 界面</text><rect x="574" y="436" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="590" y="460" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_optional_text</text><text x="836" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">空值也显示占位文案</text><rect x="24" y="480" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="40" y="504" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_visible / bind_enabled</text><text x="286" y="504" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">状态驱动显示与可用</text><rect x="574" y="480" width="522" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/><text x="590" y="504" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind_command</text><text x="836" y="504" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">点击接到 Command / AsyncCommand</text><text x="24" y="552" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">六个方法都返回 void —— 订阅由 engine 持有，它的生命周期就是绑定的生命周期。</text><rect x="24" y="579" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="595" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 14 章　数字来自 demos/ch14_binding 的真实输出（内存适配器，无真实窗口）</text></svg>
