<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="530" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Three build steps, one data flow</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Above: getting Aria into your build. Below: what happens at runtime.</text><rect x="24" y="96" width="330" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="42" y="116" width="24.6" height="21" rx="6" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="54.3" y="130.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="76" y="133" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Get Aria</text><text x="42" y="160" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">git clone, or an installed SDK</text><line x1="360" y1="138" x2="388" y2="138" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="394" y="96" width="330" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="412" y="116" width="24.6" height="21" rx="6" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="424.3" y="130.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="446" y="133" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Configure</text><text x="412" y="160" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">cmake -S . -B build -DARIA_ROOT=&lt;path&gt;</text><line x1="730" y1="138" x2="758" y2="138" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="764" y="96" width="330" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="782" y="116" width="24.6" height="21" rx="6" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="794.3" y="130.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="816" y="133" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Build</text><text x="782" y="160" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">cmake --build build</text><line x1="24" y1="214" x2="1096" y2="214" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="560" y="219" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Build succeeds → runtime</text><rect x="500" y="208" width="120" height="22" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="24" y="262" width="212" height="96" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="130" y="302.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">Property&lt;int&gt; count</text><text x="130" y="325.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Writable state</text><rect x="316" y="262" width="236" height="96" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="434" y="294.9" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">Computed&lt;int&gt; doubled</text><text x="434" y="317.8" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Read-only, dependencies</text><text x="434" y="333.75" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">auto-tracked</text><rect x="632" y="262" width="204" height="96" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/><text x="734" y="294.9" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">bind(lambda)</text><text x="734" y="317.8" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Called whenever the value</text><text x="734" y="333.75" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">changes</text><rect x="916" y="262" width="180" height="96" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="1006" y="302.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">stdout</text><text x="1006" y="325.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Real line-by-line output</text><line x1="244" y1="310" x2="308" y2="310" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="560" y1="310" x2="624" y2="310" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="844" y1="310" x2="908" y2="310" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="276" y="300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">read</text><text x="592" y="300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">push</text><text x="876" y="300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">write</text><text x="24" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Three things the framework does for you</text><rect x="24" y="410" width="243.875" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="145.938" y="426.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">Equality gate: same value = no push</text><rect x="281.875" y="410" width="202" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="382.875" y="426.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">batch: many writes, one push</text><rect x="497.875" y="410" width="229.5" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="612.625" y="426.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Dependencies: only what was read</text><text x="24" y="468" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">In other words: you write values; keeping things in sync is the framework's job.</text><rect x="24" y="495" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="511" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 2  Demo: demos/ch02_hello</text></svg>
