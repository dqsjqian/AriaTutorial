<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="590" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">从 25 个纯虚方法到 5 个</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">ViewAdapterBase 把没实现的能力变成「告警一次 + 安全默认值」</text><rect x="24" y="96" width="524" height="300" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="46" y="114" width="84.5" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="88.25" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">三层的职责</text><rect x="48" y="156" width="476" height="64" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="286" y="181.013" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">IViewAdapter</text><text x="286" y="204.588" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">约 25 个纯虚方法：契约全集</text><line x1="286" y1="220" x2="286" y2="232" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="48" y="234" width="476" height="64" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="286" y="259.012" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">ViewAdapterBase</text><text x="286" y="282.587" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">每个方法都有默认实现，全部合规</text><line x1="286" y1="298" x2="286" y2="310" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="48" y="312" width="476" height="64" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="286" y="337.012" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="middle">LiteAdapter</text><text x="286" y="360.587" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">只重写需要的 5 个</text><text x="48" y="388" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#047857" text-anchor="start">重写的 5 个：platform_name / set_text / get_text / on_text_changed / on_click</text><rect x="572" y="96" width="524" height="300" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="594" y="114" width="134.5" height="24" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="661.25" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">没重写的能力会怎样</text><text x="594" y="158" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">三条通道各有一次告警，然后走安全值：</text><text x="594" y="180" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="start">WARN  set_int</text><text x="760" y="180" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">空操作，值留在控件侧</text><text x="594" y="210" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="start">WARN  get_int</text><text x="760" y="210" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">读回 0</text><text x="594" y="240" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="start">WARN  on_int_changed</text><text x="760" y="240" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">返回空订阅，永远不触发</text><text x="594" y="270" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="start">WARN  set_enabled</text><text x="760" y="270" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">空操作</text><rect x="594" y="300" width="480" height="76" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.4"/><text x="610" y="326" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">实测：page 实际值 = 2，adapter 读回控件 = 0</text><text x="610" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">半实现的适配器不会静默给错值，而是明确告警后给一个安全的默认值。</text><text x="610" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">唯一的风险是：你要记得看日志。</text><rect x="24" y="410" width="1072" height="122" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><rect x="46" y="428" width="172" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="132" y="444.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">写完之后拿框架的套件自查</text><rect x="48" y="466" width="500" height="52" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="298" y="484.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">aria/binding/testing/adapter_conformance.hpp</text><text x="298" y="504.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">内置的五个适配器跑的就是这一份</text><rect x="572" y="466" width="502" height="52" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/><text x="823" y="484.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">aria/testing/list_conformance.hpp</text><text x="823" y="504.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">自定义列表源可以跑这一份</text><rect x="24" y="555" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="571" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 16 章　告警文案与数字取自 demos/ch16_adapter 的真实运行</text></svg>
