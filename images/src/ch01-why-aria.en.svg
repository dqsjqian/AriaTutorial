g SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Aria: split out exactly one layer</text><rect x="596" y="148" width="476" height="54" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="834" y="168.338" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#4f46e5" text-anchor="middle">ViewModel</text><text x="834" y="195.288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">A plain C++ struct that does not know what drives it</text><line x1="834" y1="202" x2="834" y2="218" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="596" y="220" width="476" height="46" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="834" y="246.712" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="middle">BindingEngine   ·   knows exactly one interface: IViewAdapter</text><line x1="648" y1="266" x2="1020" y2="266" stroke="#cbd5e1" stroke-width="1.5"/><line x1="648" y1="266" x2="648" y2="286" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="772" y1="266" x2="772" y2="286" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="896" y1="266" x2="896" y2="286" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="1020" y1="266" x2="1020" y2="286" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="596" y="286" width="104" height="84" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="648" y="321.462" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#047857" text-anchor="middle">Qt6</text><text 