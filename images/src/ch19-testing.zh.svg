<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 611" width="1120" height="611" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="611" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">被测对象是一个普通 struct</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">六组测试，加上框架自带的一致性套件</text><rect x="24" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="38" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">纯逻辑</text><line x1="38" y1="134" x2="211" y2="134" stroke="#a7f3d0" stroke-width="1.5"/><text x="38" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 空表单不能提交</text><text x="38" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 只填用户名仍不能提交</text><text x="38" y="224" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 密码 5 位不能提交</text><text x="38" y="258" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 用户名 + 6 位密码可以提交</text><text x="38" y="292" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 提示文案随状态更新</text><rect x="241" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="255" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start">派生分支</text><line x1="255" y1="134" x2="428" y2="134" stroke="#c7d2fe" stroke-width="1.5"/><text x="255" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 空用户名 → 提示输入用户名</text><text x="255" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 密码太短 → 提示密码长度</text><text x="255" y="224" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 超过次数 → 优先级最高的提示</text><rect x="458" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="472" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">订阅行为</text><line x1="472" y1="134" x2="645" y2="134" stroke="#ddd6fe" stroke-width="1.5"/><text x="472" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 等值写入被静默丢弃</text><text x="472" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 退订后不再收到通知</text><rect x="675" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><text x="689" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0e7490" text-anchor="start">批处理</text><line x1="689" y1="134" x2="862" y2="134" stroke="#a5f3fc" stroke-width="1.5"/><text x="689" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] batch 内三次写入只推一次</text><rect x="892" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="906" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">异步</text><line x1="906" y1="134" x2="1079" y2="134" stroke="#fcd34d" stroke-width="1.5"/><text x="906" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] 协程结果可以被同步取出</text><rect x="24" y="366" width="1072" height="120" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><rect x="46" y="384" width="147" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="119.5" y="400.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">框架自带的一致性套件</text><rect x="48" y="420" width="500" height="50" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="298" y="437.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">aria/binding/testing/adapter_conformance.hpp</text><text x="298" y="457.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">验一个适配器是否守约</text><rect x="572" y="420" width="502" height="50" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/><text x="823" y="437.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">aria/testing/list_conformance.hpp</text><text x="823" y="457.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">验一个自定义列表源</text><text x="48" y="478" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">内置的五个适配器与内置列表视图，跑的就是这两份测试 —— 你的适配器可以用同一把尺子。</text><text x="24" y="526" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start">本章 demo 一个测试框架都没用：被测对象是普通 struct，断言就是 std::cout。</text><text x="24" y="550" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">这正是响应式设计的收益 —— 逻辑与界面解耦之后，测试不需要跑起一个窗口。</text><rect x="24" y="576" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="592" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 19 章　全部条目与「全部通过」来自 demos/ch19_testing 的真实输出</text></svg>
