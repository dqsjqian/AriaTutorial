<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 542" width="1120" height="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#047857"/></marker><marker id="m2a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#94a3b8"/></marker><marker id="m3a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#6d28d9"/></marker></defs><rect x="0" y="0" width="1120" height="542" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">三种控制手段，管三件不同的事</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">batch 管「通知几次」　·　untracked 管「谁算依赖」　·　Effect 管「副作用活多久」</text><rect x="24" y="96" width="338" height="388" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="42" y="114" width="56.375" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="70.1875" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">batch</text><text x="42" y="166" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">逐个改：推 2 次</text><rect x="42" y="182" width="132" height="34" rx="9" fill="#ffffff" stroke="#fecaca" stroke-width="1.4"/><text x="108" y="204" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">每人 = 150</text><line x1="178" y1="199" x2="220" y2="199" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m0a)"/><text x="226" y="204" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">推送 #1</text><rect x="42" y="234" width="132" height="34" rx="9" fill="#ffffff" stroke="#fecaca" stroke-width="1.4"/><text x="108" y="256" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">每人 = 75</text><line x1="178" y1="251" x2="220" y2="251" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m0a)"/><text x="226" y="256" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">推送 #2</text><text x="42" y="306" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">界面会先闪 150 再跳到 75</text><line x1="42" y1="322" x2="344" y2="322" stroke="#e2e8f0" stroke-width="1.5"/><text x="42" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">包进 batch：推 1 次</text><rect x="42" y="366" width="132" height="34" rx="9" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.4"/><text x="108" y="388" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">每人 = 75</text><line x1="178" y1="383" x2="220" y2="383" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><text x="226" y="388" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="start">推送 #1</text><text x="42" y="428" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#047857" text-anchor="start">中间态从未出现</text><text x="42" y="458" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">→ 抑制的是通知，不是计算</text><rect x="390" y="96" width="338" height="388" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="408" y="114" width="83.875" height="24" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="449.938" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">untracked</text><text x="408" y="166" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Effect 里同时读两个值</text><rect x="408" y="186" width="132" height="38" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="474" y="210" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">b = 99</text><line x1="544" y1="205" x2="582" y2="205" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#m2a)"/><text x="588" y="210" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">untracked 读的 → 不触发</text><rect x="408" y="252" width="132" height="38" rx="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="474" y="276" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">a = 1</text><line x1="544" y1="271" x2="582" y2="271" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><text x="588" y="276" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#047857" text-anchor="start">追踪到的 → 触发</text><line x1="408" y1="324" x2="710" y2="324" stroke="#e2e8f0" stroke-width="1.5"/><text x="408" y="352" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">结果是：</text><rect x="408" y="364" width="302" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="559" y="385.05" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">effect 第 2 次：a = 1, b = 99</text><text x="559" y="405.25" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">b 变了但没重跑，重跑时却读到了新 b</text><text x="408" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">→ 读了，但不进依赖集</text><rect x="756" y="96" width="338" height="388" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="774" y="114" width="63.25" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="805.625" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Effect</text><text x="774" y="166" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">可启动、可停止的副作用</text><rect x="774" y="186" width="138" height="62" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="843" y="210.1" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#047857" text-anchor="middle">运行中</text><text x="843" y="232.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">依赖变化就重跑</text><line x1="914" y1="217" x2="942" y2="217" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m3a)"/><rect x="944" y="186" width="132" height="62" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="1010" y="210.1" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle">已停止</text><text x="1010" y="232.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">active = false</text><line x1="774" y1="276" x2="1076" y2="276" stroke="#e2e8f0" stroke-width="1.5"/><text x="774" y="302" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">停止前 ticks</text><text x="1076" y="302" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">3</text><text x="774" y="336" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">停止后 ticks</text><text x="1076" y="336" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">3</text><text x="774" y="370" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">停止后 active</text><text x="1076" y="370" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">false</text><text x="774" y="424" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">→ stop() 之后再改依赖，回调不再执行</text><text x="774" y="448" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">← 本章 demo 的实测数字</text><rect x="24" y="507" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="523" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 5 章　三个数字都来自 demos/ch05_batch 的真实输出</text></svg>
