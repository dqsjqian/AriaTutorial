ily="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">ValidationState.warnings</text><text x="678" y="256.525" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">warnings live here</text><text x="824" y="158" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">ValidationResult holds only</text><text x="824" y="176" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">valid + errors -- there is no warnings member</text><text x="824" y="240" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">warnings and pending belong to the state,</text><text x="824" y="258" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">not to a single evaluation result.</text><text x="24" y="302" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">② Four stages of one field</text><rect x="24" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="40" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">""</text><text x="40" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">1 error</text><text x="40" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">cannot be empty</text><line x1="278" y1="370" x2="294" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="298" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="314" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">"admin"</text><text x="314" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">1 warning</text><text x="314" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">a bit short</text><line x1="552" y1="370" x2="568" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="572" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="588" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">"admintest"</text><text x="588" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">1 error</text><text x="588" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">at most 8 characters</text><line x1="826" y1="370" x2="842" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="846" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="862" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#047857" text-anchor="start">"aria"</text><text x="862" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start">all clear</text><text x="862" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">no error, no warning</text><rect x="24" y="448" width="524" height="128" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="46" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">③ Async validation: pending is a third state</text><text x="46" y="504" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">· pending = false</text><text x="46" y="524" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="start">· server lookup starts → pending = true</text><text x="46" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">· returns taken → 1 error</text><text x="46" y="564" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="start">· re-check returns free → 0 errors</text><rect x="572" y="448" width="524" height="128" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><text x="594" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0e7490" text-anchor="start">④ Cross-field: the predicate reads another field</text><text x="594" y="506" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">password = "aria2026"  confirm = "aria2027"</text><text x="594" y="526" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">→ the passwords do not match</text><text x="594" y="552" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#047857" text-anchor="start">confirm fixed → passes</text><rect x="24" y="599" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="615" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 12  All text and counts from the real output of demos/ch12_validation</text></svg>
