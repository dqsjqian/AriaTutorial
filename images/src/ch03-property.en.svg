<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 542" width="1120" height="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#047857"/></marker><marker id="m2a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#4f46e5"/></marker></defs><rect x="0" y="0" width="1120" height="542" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">One assignment, three decisions the framework makes</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Left: the write path. Right: three subscription timings and two ways to read.</text><rect x="24" y="108" width="112" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="80" y="124.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">The write path</text><rect x="48" y="148" width="476" height="50" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="286" y="177.675" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">p = v</text><line x1="286" y1="198" x2="286" y2="218" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="98" y="218" width="376" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="286" y="249.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Is the new value equal to the current one?</text><line x1="98" y1="274" x2="474" y2="274" stroke="#cbd5e1" stroke-width="1.5"/><line x1="160" y1="274" x2="160" y2="300" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="412" y1="274" x2="412" y2="300" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m2a)"/><text x="150" y="292" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="end">equal</text><text x="422" y="292" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="start">different</text><rect x="48" y="300" width="224" height="84" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="160" y="334.65" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="middle">Silently dropped</text><text x="160" y="358.225" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">No subscriber is notified</text><rect x="300" y="300" width="224" height="84" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="412" y="334.65" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Version + 1</text><text x="412" y="358.225" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">Subscribers notified in turn</text><text x="48" y="420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">The equality gate is on by default -- no `if` needed.</text><text x="48" y="444" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="start">One exception: mutate() edits in place and skips the comparison.</text><rect x="596" y="108" width="247" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="719.5" y="124.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Subscription timing and how to read</text><text x="612" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">Method</text><text x="838" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Fires once immediately</text><text x="960" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">On every change</text><text x="1068" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Sees the old value</text><line x1="596" y1="164" x2="1080" y2="164" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="196" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind</text><text x="838" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="960" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><line x1="596" y1="212" x2="1080" y2="212" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="242" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">on_changed</text><text x="838" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><text x="960" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><line x1="596" y1="258" x2="1080" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="288" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="start">observe</text><text x="838" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><text x="960" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><line x1="596" y1="318" x2="1080" y2="318" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="340" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Reading the value</text><rect x="612" y="354" width="226" height="66" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="725" y="379.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">get()</text><text x="725" y="402.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Reads, and records a dependency</text><rect x="854" y="354" width="226" height="66" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="967" y="379.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">peek()</text><text x="967" y="402.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Reads, records nothing</text><text x="596" y="480" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">→ peek escapes tracking; get makes Computed remember the edge.</text><rect x="24" y="507" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="523" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 3  Values taken from the real output of demos/ch03_property</text></svg>
