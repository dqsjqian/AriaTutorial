<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 611" width="1120" height="611" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="611" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">The thing under test is a plain struct</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Six groups of tests, plus the framework's own conformance suites</text><rect x="24" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="38" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">Pure logic</text><line x1="38" y1="134" x2="211" y2="134" stroke="#a7f3d0" stroke-width="1.5"/><text x="38" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] empty form cannot submit</text><text x="38" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] username alone is not enough</text><text x="38" y="224" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] a 5-char password is not</text><text x="38" y="237" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     enough</text><text x="38" y="258" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] username + 6-char password</text><text x="38" y="271" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     works</text><text x="38" y="292" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] the hint text tracks state</text><rect x="241" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="255" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start">Derived branches</text><line x1="255" y1="134" x2="428" y2="134" stroke="#c7d2fe" stroke-width="1.5"/><text x="255" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] empty username → ask for it</text><text x="255" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] short password → say so</text><text x="255" y="224" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] over the limit →</text><text x="255" y="237" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     highest-priority hint</text><rect x="458" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="472" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">Subscription behaviour</text><line x1="472" y1="134" x2="645" y2="134" stroke="#ddd6fe" stroke-width="1.5"/><text x="472" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] equal writes are dropped</text><text x="472" y="190" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] no notification after</text><text x="472" y="203" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     unsubscribe</text><rect x="675" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><text x="689" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0e7490" text-anchor="start">Batching</text><line x1="689" y1="134" x2="862" y2="134" stroke="#a5f3fc" stroke-width="1.5"/><text x="689" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] three writes in batch push</text><text x="689" y="169" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     once</text><rect x="892" y="96" width="201" height="250" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="906" y="124" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">Async</text><line x1="906" y1="134" x2="1079" y2="134" stroke="#fcd34d" stroke-width="1.5"/><text x="906" y="156" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">[ok] a coroutine result can be</text><text x="906" y="169" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">     taken synchronously</text><rect x="24" y="366" width="1072" height="120" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><rect x="46" y="384" width="270.75" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="181.375" y="400.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">The framework's own conformance suites</text><rect x="48" y="420" width="500" height="50" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="298" y="437.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">aria/binding/testing/adapter_conformance.hpp</text><text x="298" y="457.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">checks an adapter honours the contract</text><rect x="572" y="420" width="502" height="50" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/><text x="823" y="437.55" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">aria/testing/list_conformance.hpp</text><text x="823" y="457.075" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">checks a custom list source</text><text x="48" y="478" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">The five built-in adapters and the built-in list views run exactly these -- your adapter can use the same ruler.</text><text x="24" y="526" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start">This chapter's demo uses no test framework at all: the subject is a plain struct and the assertion is std::cout.</text><text x="24" y="550" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">That is the payoff of the design: once logic is decoupled from the UI, tests need no window.</text><rect x="24" y="576" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="592" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 19  Every line and the final all-pass from the real output of demos/ch19_testing</text></svg>
