<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 682" width="1120" height="682" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#047857"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker><marker id="m2a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="682" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">两条等结果的路，一条能用一条会崩</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">再往下是并发时间的实测值，和取消令牌的传播方向</text><text x="24" y="92" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="start">① blocking_get 的适用边界</text><rect x="24" y="104" width="524" height="176" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="46" y="136" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">同步任务体：可以直接取</text><text x="46" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#334155" text-anchor="start">auto t = square(7);  t.blocking_get()</text><text x="46" y="190" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">实测 square(7) = 49</text><text x="46" y="218" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">任务体里全是 co_return，没有真的换线程，</text><text x="46" y="238" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">在当前线程直接跑完，取值不会死等。</text><text x="46" y="264" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="start">→ 官方测试也用这个模式</text><rect x="572" y="104" width="524" height="176" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="594" y="136" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">真异步：必须自己等</text><text x="594" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#334155" text-anchor="start">task.start_detached()  +  轮询标志</text><text x="594" y="190" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">实测 square_on_pool(9) = 81</text><text x="594" y="218" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">一旦任务体里有 schedule_on，blocking_get 就会</text><text x="594" y="238" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">等待一个永远不会在本线程完成的东西。</text><text x="594" y="264" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">症状：进程 0xC0000409 直接终止</text><text x="24" y="314" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">② when_all：三个任务一起等</text><rect x="24" y="326" width="1072" height="152" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="46" y="356" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">三个各睡 60ms 的任务</text><rect x="300" y="348" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="359.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t1  ·  60ms</text><rect x="300" y="368" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="379.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t2  ·  60ms</text><rect x="300" y="388" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="399.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t3  ·  60ms</text><text x="484" y="360" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">三条都落在同一段墙钟时间里</text><line x1="300" y1="418" x2="810" y2="418" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="824" y="422" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">参考：串行约 180ms</text><line x1="300" y1="436" x2="486" y2="436" stroke="#047857" stroke-width="1.8" marker-end="url(#m0a)"/><text x="496" y="441" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">实测总耗时 62ms</text><text x="46" y="462" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">1² + 2² + 3² = 14 —— 结果按序收集，不是先到先得。</text><text x="24" y="500" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b45309" text-anchor="start">③ 取消：令牌是树，不是全局开关</text><rect x="24" y="512" width="1072" height="112" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="60" y="548" width="150" height="44" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="135" y="573.438" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">父令牌</text><rect x="340" y="540" width="160" height="36" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="420" y="561.025" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">子令牌</text><rect x="340" y="586" width="160" height="36" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="420" y="607.025" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">另一个子令牌</text><line x1="214" y1="564" x2="336" y2="558" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="214" y1="576" x2="336" y2="604" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m2a)"/><text x="520" y="558" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">取消子令牌 → 子已取消 = true，父不受影响 = false</text><text x="520" y="604" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="start">取消父令牌 → 传播到所有子令牌</text><rect x="24" y="647" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="663" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 17 章　耗时与结果来自 demos/ch17_async 在当前机器上的实测</text></svg>
