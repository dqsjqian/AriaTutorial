<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 634" width="1120" height="634" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker><marker id="m2a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b45309"/></marker></defs><rect x="0" y="0" width="1120" height="634" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">校验也是响应式的</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">错误和警告是两类东西，异步校验是第三种状态</text><text x="24" y="92" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="start">① must 产生 error，should 产生 warning</text><rect x="24" y="104" width="1072" height="164" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="176" width="180" height="62" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="138" y="210.85" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">字段值</text><line x1="232" y1="207" x2="276" y2="207" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="280" y="132" width="220" height="56" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="390" y="152.6" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">must 规则失败</text><text x="390" y="174.15" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">严重，阻断提交</text><rect x="280" y="216" width="220" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="390" y="236.6" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">should 规则失败</text><text x="390" y="258.15" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">提醒，不阻断</text><line x1="504" y1="160" x2="556" y2="160" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="504" y1="244" x2="556" y2="244" stroke="#b45309" stroke-width="1.8" marker-end="url(#m2a)"/><rect x="560" y="132" width="236" height="56" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="678" y="152.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">ValidationResult.errors</text><text x="678" y="172.525" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">这里只有错误</text><rect x="560" y="216" width="236" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="678" y="236.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">ValidationState.warnings</text><text x="678" y="256.525" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">警告在这里</text><text x="824" y="158" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">ValidationResult 只有</text><text x="824" y="176" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">valid + errors —— 没有 warnings</text><text x="824" y="240" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">警告与 pending 都属于状态，</text><text x="824" y="258" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">不属于单次求值的结果。</text><text x="24" y="302" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">② 同一个字段的四个阶段</text><rect x="24" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="40" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">""</text><text x="40" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">错误 1 条</text><text x="40" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">不能为空</text><line x1="278" y1="370" x2="294" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="298" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="314" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b45309" text-anchor="start">"admin"</text><text x="314" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">警告 1 条</text><text x="314" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">长度偏短</text><line x1="552" y1="370" x2="568" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="572" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="588" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">"admintest"</text><text x="588" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">错误 1 条</text><text x="588" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">最多 8 个字符</text><line x1="826" y1="370" x2="842" y2="370" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="846" y="316" width="250" height="108" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="862" y="344" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="15" font-weight="700" fill="#047857" text-anchor="start">"aria"</text><text x="862" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start">全部通过</text><text x="862" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">无错误无警告</text><rect x="24" y="448" width="524" height="128" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="46" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start">③ 异步校验：pending 是第三种状态</text><text x="46" y="504" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start">· pending = false</text><text x="46" y="524" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="start">· 发起服务端查重 → pending = true</text><text x="46" y="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">· 返回「已被占用」→ 1 条错误</text><text x="46" y="564" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="start">· 重查返回可用 → 0 条错误</text><rect x="572" y="448" width="524" height="128" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><text x="594" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0e7490" text-anchor="start">④ 跨字段：谓词里读另一个字段</text><text x="594" y="506" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">password = "aria2026"　confirm = "aria2027"</text><text x="594" y="526" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">→ 两次输入的密码不一致</text><text x="594" y="552" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#047857" text-anchor="start">confirm 改成一致 → 通过</text><rect x="24" y="599" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="615" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 12 章　全部文案与计数来自 demos/ch12_validation 的真实输出</text></svg>
