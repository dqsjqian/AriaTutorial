<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 607" width="1120" height="607" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#6d28d9"/></marker></defs><rect x="0" y="0" width="1120" height="607" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">订阅的生命周期：用作用域表达，而不是手动记账</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">四种断开方式，对应四种代码结构</text><rect x="24" y="96" width="524" height="200" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="44" y="126" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="start">① 离开作用域</text><text x="44" y="148" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">订阅随 Subscription 析构自动断开</text><rect x="44" y="174" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="194" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">订阅存活</text><line x1="344" y1="184" x2="494" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="344" cy="184" r="5" fill="#4f46e5"/><text x="500" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">断开</text><text x="44" y="220" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· 作用域内 active = true</text><text x="44" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· 离开后 p = 2，无任何输出</text><rect x="572" y="96" width="524" height="200" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="592" y="126" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="start">② release() 主动提前断开</text><text x="592" y="148" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">不用等到析构，手动断</text><rect x="592" y="174" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="742" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">订阅存活</text><line x1="892" y1="184" x2="1042" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="892" cy="184" r="5" fill="#047857"/><text x="1048" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">断开</text><text x="592" y="220" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· release 后 active = false</text><text x="592" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· p = 4 没有输出</text><rect x="24" y="320" width="524" height="200" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="44" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="start">③ SubscriptionBag 一次性收拢</text><text x="44" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">反序释放：后加的先断</text><rect x="44" y="398" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">订阅 3</text><line x1="146" y1="409" x2="182" y2="409" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">断开第 3 条</text><rect x="44" y="428" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="443" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">订阅 2</text><line x1="146" y1="439" x2="182" y2="439" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="443" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">断开第 2 条</text><rect x="44" y="458" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="473" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">订阅 1</text><line x1="146" y1="469" x2="182" y2="469" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="473" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">断开第 1 条</text><rect x="572" y="320" width="524" height="200" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="592" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="start">④ 装进成员，随对象销毁</text><text x="592" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">对象析构时一次性拆干净</text><rect x="592" y="398" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="742" y="412" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">订阅存活</text><line x1="892" y1="408" x2="1042" y2="408" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="892" cy="408" r="5" fill="#b45309"/><text x="1048" y="412" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">断开</text><text x="592" y="444" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· panel 绑定 5 → 收到 5</text><text x="592" y="466" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· panel 析构后 p = 6 无输出</text><text x="24" y="545" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">共同点：断开这件事由对象的生命周期决定，不由你记不记得调用。</text><rect x="24" y="572" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="588" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 6 章　文案与数字取自 demos/ch06_subscription 的实际运行</text></svg>
