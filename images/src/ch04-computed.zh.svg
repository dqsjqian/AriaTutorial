<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="640" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Computed：依赖是「读到了才记」，值一变就重算</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">上面是动态依赖，下面是重算时机，数字全部来自本章 demo 的真实输出</text><text x="24" y="92" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="start">① 依赖集随分支变化</text><rect x="24" y="104" width="524" height="232" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="342" y="166" width="176" height="100" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="430" y="208.425" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">value</text><text x="430" y="232.675" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">依赖个数 = 2</text><rect x="60" y="124" width="116" height="44" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="118" y="149.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">use_b</text><line x1="176" y1="146" x2="292" y2="146" stroke="#cbd5e1" stroke-width="1.5"/><rect x="60" y="188" width="116" height="44" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="118" y="213.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">a</text><line x1="176" y1="210" x2="292" y2="210" stroke="#cbd5e1" stroke-width="1.5"/><rect x="60" y="252" width="116" height="44" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="118" y="277.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">b</text><line x1="176" y1="274" x2="252" y2="274" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="264" y="279" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">✗</text><line x1="292" y1="146" x2="292" y2="210" stroke="#cbd5e1" stroke-width="1.5"/><line x1="292" y1="178" x2="338" y2="216" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="374" y="294" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">b 还没被读到 → 改 b 不影响 value</text><rect x="572" y="104" width="524" height="232" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="890" y="166" width="176" height="100" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="978" y="208.425" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">value</text><text x="978" y="232.675" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">依赖个数 = 3</text><rect x="608" y="124" width="116" height="44" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="666" y="149.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">use_b</text><line x1="724" y1="146" x2="840" y2="146" stroke="#cbd5e1" stroke-width="1.5"/><rect x="608" y="188" width="116" height="44" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="666" y="213.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">a</text><line x1="724" y1="210" x2="840" y2="210" stroke="#cbd5e1" stroke-width="1.5"/><rect x="608" y="252" width="116" height="44" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="666" y="277.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">b</text><line x1="724" y1="274" x2="840" y2="274" stroke="#cbd5e1" stroke-width="1.5"/><line x1="840" y1="146" x2="840" y2="274" stroke="#cbd5e1" stroke-width="1.5"/><line x1="840" y1="210" x2="886" y2="216" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="922" y="294" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">use_b 翻成 true 后，b 进入依赖集</text><text x="24" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">真实输出：改 b 后 value 仍是 1（重算次数不变）；把 use_b 翻成 true 后再改 b，value 从 21 变成 31。</text><text x="24" y="410" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b45309" text-anchor="start">② 重算时机：依赖一变就算，结果会缓存</text><line x1="80" y1="512" x2="1060" y2="512" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="110" cy="512" r="7" fill="#4f46e5"/><text x="110" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">构造</text><text x="110" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="middle">重算 = 1</text><circle cx="290" cy="512" r="7" fill="#b45309"/><text x="290" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">src = 5</text><text x="290" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">重算 = 2</text><circle cx="470" cy="512" r="7" fill="#047857"/><text x="470" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">读 → 10</text><text x="470" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">重算 = 2（缓存）</text><circle cx="650" cy="512" r="7" fill="#047857"/><text x="650" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">再读 → 10</text><text x="650" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">重算 = 2（缓存）</text><circle cx="830" cy="512" r="7" fill="#b45309"/><text x="830" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">src = 6</text><text x="830" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">重算 = 3</text><circle cx="1010" cy="512" r="7" fill="#047857"/><text x="1010" y="460" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">读 → 12</text><text x="1010" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">重算 = 3</text><text x="560" y="578" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="middle">注意第 2 步：还没人去读，重算就已经发生了 —— 它不是惰性求值。</text><rect x="24" y="605" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="621" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 4 章　数据来自 demos/ch04_computed 的实际运行</text></svg>
