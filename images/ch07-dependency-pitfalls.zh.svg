<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" width="1120" height="624" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker></defs><rect x="0" y="0" width="1120" height="624" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">两个必须认识的坑</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">一个让通知漏掉，一个让框架直接熔断</text><rect x="24" y="96" width="524" height="268" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="46" y="114" width="109.5" height="24" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="100.75" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">坑一：幽灵依赖</text><text x="46" y="168" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">当前分支没读到的值，不算依赖</text><rect x="330" y="226" width="190" height="88" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="425" y="262.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">value</text><text x="425" y="285.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">重算次数</text><rect x="48" y="186" width="110" height="32" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="103" y="205.163" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="middle">use_b</text><line x1="160" y1="202" x2="292" y2="202" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="226" width="110" height="32" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="103" y="245.163" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="middle">a</text><line x1="160" y1="242" x2="292" y2="242" stroke="#cbd5e1" stroke-width="1.5"/><rect x="48" y="266" width="110" height="32" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="103" y="285.163" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">b</text><line x1="160" y1="282" x2="254" y2="282" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="268" y="287" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">✗</text><line x1="292" y1="202" x2="292" y2="282" stroke="#cbd5e1" stroke-width="1.5"/><line x1="292" y1="242" x2="326" y2="270" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="46" y="330" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">改 b → 重算次数 1 → 2？</text><text x="46" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">实测：仍是 1，值 = 1</text><rect x="572" y="96" width="524" height="268" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="594" y="114" width="109.5" height="24" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/><text x="648.75" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">坑二：循环依赖</text><text x="594" y="168" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">写在谓词里的自引用会成环</text><rect x="620" y="230" width="128" height="46" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="684" y="246.6" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">A</text><text x="684" y="269.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">读 B</text><rect x="820" y="230" width="128" height="46" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="884" y="246.6" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">B</text><text x="884" y="269.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">读 A</text><line x1="748" y1="245" x2="816" y2="245" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="820" y1="262" x2="752" y2="262" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><text x="784" y="292" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle">✗</text><rect x="750" y="304" width="300" height="56" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="900" y="325.188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CircularDependencyError</text><text x="900" y="346.062" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">框架主动熔断，不会栈溢出</text><text x="594" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">实测：捕获到异常，消息 117 字符</text><rect x="24" y="386" width="1072" height="150" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><rect x="46" y="404" width="172" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="132" y="420.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">正确做法：把环拆成单向链</text><text x="46" y="458" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">派生值之间只沿一个方向流动，回读只发生在输入侧</text><rect x="620" y="462" width="130" height="48" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="685" y="489.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">a</text><line x1="752" y1="486" x2="786" y2="486" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="792" y="462" width="130" height="48" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="857" y="489.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">doubled</text><line x1="924" y1="486" x2="958" y2="486" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="964" y="462" width="130" height="48" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="1029" y="489.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">b1</text><text x="46" y="496" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="400" fill="#047857" text-anchor="start">doubled = 10, b1 = 11　→　doubled = 12, b1 = 13</text><text x="24" y="562" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">幽灵依赖靠「一次静默失败」发现；循环依赖靠框架在第一次求值时立刻报错。</text><rect x="24" y="589" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="605" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 7 章　所有计数与消息长度来自 demos/ch07_pitfalls 的真实输出</text></svg>
