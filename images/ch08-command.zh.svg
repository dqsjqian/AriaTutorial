<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 628" width="1120" height="628" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="628" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">动作也有状态：能不能点、在不在跑、上次结果</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Command 管准入，AsyncCommand 管三态</text><rect x="24" y="96" width="1072" height="196" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="46" y="114" width="195.125" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="143.562" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Command：谓词决定能不能执行</text><rect x="48" y="158" width="150" height="66" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="123" y="184.013" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">agreed</text><text x="123" y="207.588" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Property&lt;bool&gt;</text><rect x="238" y="158" width="200" height="66" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="338" y="194.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">谓词 agreed.get()</text><rect x="478" y="158" width="150" height="66" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="553" y="194.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="middle">can_execute</text><rect x="668" y="158" width="150" height="66" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="743" y="194.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="middle">submit()</text><rect x="858" y="158" width="190" height="66" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="953" y="183.963" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">submitted</text><text x="953" y="205.513" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">实际执行次数</text><line x1="206" y1="191" x2="230" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="446" y1="191" x2="470" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="636" y1="191" x2="660" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="826" y1="191" x2="850" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="48" y="258" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">agreed = false 时 submits() 被静默忽略 → submitted = 0　　agreed = true 时执行 → submitted = 1</text><text x="48" y="280" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="start">注意：观察 can_execute 只在**变化**时回调 —— 和 bind 不同，它不会先同步一次。</text><rect x="24" y="312" width="1072" height="212" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="46" y="330" width="242" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="167" y="346.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">AsyncCommand：提交、执行中、已完成</text><rect x="48" y="374" width="280" height="76" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="188" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">未执行</text><text x="188" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">is_executing = false</text><rect x="420" y="374" width="280" height="76" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="560" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">执行中</text><text x="560" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">is_executing = true</text><rect x="792" y="374" width="280" height="76" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="932" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">已完成</text><text x="932" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">result = 42　error = 无</text><line x1="332" y1="412" x2="414" y2="412" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="704" y1="412" x2="786" y2="412" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="373" y="366" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">execute(21)</text><text x="745" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">worker 完成</text><text x="48" y="486" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">三种并发策略：</text><rect x="150" y="472" width="72.6" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="186.3" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Parallel</text><rect x="258.6" y="472" width="85.25" height="24" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.2"/><text x="301.225" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">LatestOnly</text><rect x="379.85" y="472" width="104.225" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="431.963" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">DropIfRunning</text><text x="528.075" y="488" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">← 本章用这个</text><text x="24" y="566" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">编译期约束：ui 必须是 MainThreadExecutor —— ui 用 InlineExecutor 而 worker 在别的线程会被 static_assert 拦下。</text><rect x="24" y="593" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="609" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 8 章　数字来自 demos/ch08_command 的真实输出</text></svg>
