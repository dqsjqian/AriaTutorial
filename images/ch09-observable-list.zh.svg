<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 616" width="1120" height="616" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="616" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">列表的每次增删改移，都是一次结构化事件</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">六种事件，各自带哪些字段</text><rect x="24" y="96" width="338" height="118" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><rect x="42" y="114" width="57.6" height="21" rx="6" fill="#047857" stroke="none" stroke-width="0"/><text x="70.8" y="128.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Insert</text><text x="42" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：index + item</text><text x="42" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">插入</text><rect x="390" y="96" width="338" height="118" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="408" y="114" width="57.6" height="21" rx="6" fill="#b91c1c" stroke="none" stroke-width="0"/><text x="436.8" y="128.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Remove</text><text x="408" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：index + item</text><text x="408" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">删除</text><rect x="756" y="96" width="338" height="118" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="774" y="114" width="64.2" height="21" rx="6" fill="#b45309" stroke="none" stroke-width="0"/><text x="806.1" y="128.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Replace</text><text x="774" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：index + item</text><text x="774" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">替换</text><rect x="24" y="228" width="338" height="118" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><rect x="42" y="246" width="44.4" height="21" rx="6" fill="#0e7490" stroke="none" stroke-width="0"/><text x="64.2" y="260.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Move</text><text x="42" y="296" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：index + from_index + item</text><text x="42" y="320" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">移动</text><rect x="390" y="228" width="338" height="118" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="408" y="246" width="90.6" height="21" rx="6" fill="#6d28d9" stroke="none" stroke-width="0"/><text x="453.3" y="260.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ItemChanged</text><text x="408" y="296" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：index + item</text><text x="408" y="320" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">元素自身变化</text><rect x="756" y="228" width="338" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="774" y="246" width="51" height="21" rx="6" fill="#475569" stroke="none" stroke-width="0"/><text x="799.5" y="260.82" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Reset</text><text x="774" y="296" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">携带字段：snapshot</text><text x="774" y="320" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">整表重建</text><text x="24" y="392" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">本章 demo 的真实事件流</text><rect x="48" y="410" width="158" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/><text x="127" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Insert 0</text><text x="127" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">写教程</text><rect x="226" y="410" width="158" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/><text x="305" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Insert 1</text><text x="305" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">跑 demo</text><rect x="404" y="410" width="158" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/><text x="483" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Insert 2</text><text x="483" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">发 GitHub</text><rect x="582" y="410" width="158" height="56" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.4"/><text x="661" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">Move 2→0</text><text x="661" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">发 GitHub</text><rect x="760" y="410" width="158" height="56" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/><text x="839" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Remove 1</text><text x="839" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">写教程</text><rect x="938" y="410" width="158" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/><text x="1017" y="432" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Replace 0</text><text x="1017" y="452" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">改标题</text><text x="24" y="496" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">事件给出的 index 指向「接收方重放后的镜像」，不是生产方当前状态。</text><text x="24" y="530" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">元素是 shared_ptr：at() 返回智能指针，items() 返回视图。</text><text x="24" y="554" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">元素内部的 Property 变化会单独产生 ItemChanged，不会伪造一次列表结构变更。</text><rect x="24" y="581" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="597" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 9 章　事件流取自 demos/ch09_list 的实际运行</text></svg>
