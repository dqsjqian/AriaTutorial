<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 607" width="1120" height="607" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#6d28d9"/></marker></defs><rect x="0" y="0" width="1120" height="607" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Subscription lifetime: expressed by scope, not by bookkeeping</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Four ways to disconnect, matching four code shapes</text><rect x="24" y="96" width="524" height="200" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="44" y="126" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="start">① Leaving the scope</text><text x="44" y="148" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Destroying the Subscription disconnects</text><rect x="44" y="174" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="194" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">subscription alive</text><line x1="344" y1="184" x2="494" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="344" cy="184" r="5" fill="#4f46e5"/><text x="500" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">gone</text><text x="44" y="220" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· inside: active = true</text><text x="44" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· after: p = 2, no output</text><rect x="572" y="96" width="524" height="200" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="592" y="126" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="start">② release() to disconnect early</text><text x="592" y="148" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">No need to wait for destruction</text><rect x="592" y="174" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="742" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">subscription alive</text><line x1="892" y1="184" x2="1042" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="892" cy="184" r="5" fill="#047857"/><text x="1048" y="188" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">gone</text><text x="592" y="220" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· after release: active = false</text><text x="592" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· p = 4 produces no output</text><rect x="24" y="320" width="524" height="200" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><text x="44" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="start">③ SubscriptionBag collects them all</text><text x="44" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Released in reverse order: last in, first out</text><rect x="44" y="398" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">sub 3</text><line x1="146" y1="409" x2="182" y2="409" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">disconnect 3</text><rect x="44" y="428" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="443" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">sub 2</text><line x1="146" y1="439" x2="182" y2="439" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="443" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">disconnect 2</text><rect x="44" y="458" width="96" height="22" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="92" y="473" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#6d28d9" text-anchor="middle">sub 1</text><line x1="146" y1="469" x2="182" y2="469" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#m0a)"/><text x="190" y="473" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">disconnect 1</text><rect x="572" y="320" width="524" height="200" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="592" y="350" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="start">④ Store as a member, dies with the object</text><text x="592" y="372" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">The whole set is torn down when the object dies</text><rect x="592" y="398" width="300" height="20" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="742" y="412" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">subscription alive</text><line x1="892" y1="408" x2="1042" y2="408" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="892" cy="408" r="5" fill="#b45309"/><text x="1048" y="412" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">gone</text><text x="592" y="444" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· panel binds 5 → receives 5</text><text x="592" y="466" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">· after panel dies: p = 6, no output</text><text x="24" y="545" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">The common idea: disconnection follows object lifetime, not your memory.</text><rect x="24" y="572" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="588" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 6  Text and numbers from a real run of demos/ch06_subscription</text></svg>
