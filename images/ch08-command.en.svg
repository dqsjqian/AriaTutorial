<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 628" width="1120" height="628" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="628" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Actions have state too: can it run, is it running, what did it return</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Command gates entry; AsyncCommand exposes three states</text><rect x="24" y="96" width="1072" height="196" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="46" y="114" width="305.75" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="198.875" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Command: a predicate decides whether it runs</text><rect x="48" y="158" width="150" height="66" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="123" y="184.013" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#475569" text-anchor="middle">agreed</text><text x="123" y="207.588" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Property&lt;bool&gt;</text><rect x="238" y="158" width="200" height="66" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="338" y="194.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">predicate agreed.get()</text><rect x="478" y="158" width="150" height="66" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="553" y="194.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="middle">can_execute</text><rect x="668" y="158" width="150" height="66" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="743" y="194.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="middle">submit()</text><rect x="858" y="158" width="190" height="66" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="953" y="183.963" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">submitted</text><text x="953" y="205.513" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">times actually run</text><line x1="206" y1="191" x2="230" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="446" y1="191" x2="470" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="636" y1="191" x2="660" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="826" y1="191" x2="850" y2="191" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="48" y="258" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">With agreed = false the call is silently ignored → submitted = 0.  With agreed = true it runs → submitted = 1</text><text x="48" y="280" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="start">Note: observing can_execute fires only on change -- unlike bind, it does not fire once on registration.</text><rect x="24" y="312" width="1072" height="212" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="46" y="330" width="273.875" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="182.938" y="346.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">AsyncCommand: submitted, running, done</text><rect x="48" y="374" width="280" height="76" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="188" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Idle</text><text x="188" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">is_executing = false</text><rect x="420" y="374" width="280" height="76" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="560" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">Running</text><text x="560" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">is_executing = true</text><rect x="792" y="374" width="280" height="76" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="932" y="404.788" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">Finished</text><text x="932" y="429.038" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">result = 42  error = none</text><line x1="332" y1="412" x2="414" y2="412" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="704" y1="412" x2="786" y2="412" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="373" y="366" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">execute(21)</text><text x="745" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">worker done</text><text x="48" y="486" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Three concurrency policies:</text><rect x="150" y="472" width="72.6" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="186.3" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Parallel</text><rect x="258.6" y="472" width="85.25" height="24" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.2"/><text x="301.225" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">LatestOnly</text><rect x="379.85" y="472" width="104.225" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="431.963" y="488.14" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">DropIfRunning</text><text x="528.075" y="488" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">← used in this chapter</text><text x="24" y="566" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Compile-time constraint: ui must be a MainThreadExecutor -- pairing an InlineExecutor ui with a cross-thread worker trips a static_assert.</text><rect x="24" y="593" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="609" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 8  Numbers from the real output of demos/ch08_command</text></svg>
