"218" width="376" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="286" y="249.988" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">新值和当前值相等吗？</text><line x1="98" y1="274" x2="474" y2="274" stroke="#cbd5e1" stroke-width="1.5"/><line x1="160" y1="274" x2="160" y2="300" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="412" y1="274" x2="412" y2="300" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m2a)"/><text x="150" y="292" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="end">相等</text><text x="422" y="292" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="start">不等</text><rect x="48" y="300" width="224" height="84" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="160" y="334.65" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#047857" text-anchor="middle">静默丢弃</text><text x="160" y="358.225" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">订阅者收不到任何通知</text><rect x="300" y="300" width="224" height="84" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="412" y="334.65" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4f46e5" text-anchor="middle">版本号 +1</text><text x="412" y="358.225" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">逐个通知订阅者</text><text x="48" y="420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">等值门是默认行为 —— 你不需要写任何 if。</text><text x="48" y="444" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="start">唯一例外：mutate() 原地改容器，不做等值比较。</text><rect x="596" y="108" width="134.5" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="663.25" y="124.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">订阅时机与读取方式</text><text x="612" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">方法</text><text x="838" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">立即先调一次</text><text x="960" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">每次变化</text><text x="1068" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">拿到旧值</text><line x1="596" y1="164" x2="1080" y2="164" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="196" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">bind</text><text x="838" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="960" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><line x1="596" y1="212" x2="1080" y2="212" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="242" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">on_changed</text><text x="838" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><text x="960" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><line x1="596" y1="258" x2="1080" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="288" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="start">observe</text><text x="838" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">✗</text><text x="960" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><text x="1068" y="288" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">✓</text><line x1="596" y1="318" x2="1080" y2="318" stroke="#e2e8f0" stroke-width="1.5"/><text x="612" y="340" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">读值方式</text><rect x="612" y="354" width="226" height="66" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="725" y="379.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">get()</text><text x="725" y="402.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">读值，并建立依赖</text><rect x="854" y="354" width="226" height="66" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="967" y="379.875" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">peek()</text><text x="967" y="402.775" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">读值，但不建立依赖</text><text x="596" y="480" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">→ 用 peek 跳出追踪，用 get 让 Computed 记住这条边。</text><rect x="24" y="507" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="523" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 3 章　数字取自 demos/ch03_property 的真实输出</text></svg>
