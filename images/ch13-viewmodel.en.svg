<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 544" width="1120" height="544" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker></defs><rect x="0" y="0" width="1120" height="544" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Activation, the parent/child tree, destroy hooks</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Three concepts, three jobs: an idempotent switch, tree propagation, teardown order</text><rect x="24" y="96" width="524" height="222" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="46" y="114" width="229.5" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="160.75" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">①② Idempotent + tree propagation</text><rect x="196" y="158" width="180" height="52" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="286" y="177.1" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="middle">parent</text><text x="286" y="199.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">activate ×3</text><line x1="286" y1="210" x2="286" y2="240" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="196" y="240" width="180" height="52" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><text x="286" y="259.1" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#047857" text-anchor="middle">child</text><text x="286" y="281.325" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">activates with its parent</text><text x="46" y="258" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Called three times,</text><text x="46" y="278" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4f46e5" text-anchor="start">on_activate runs once.</text><rect x="572" y="96" width="524" height="222" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="594" y="114" width="263.875" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="725.938" y="130.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">④ destroy hooks run last-in-first-out</text><rect x="618" y="162" width="132" height="46" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><text x="684" y="191" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">hook 3</text><text x="684" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">registered #1</text><rect x="770" y="162" width="132" height="46" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/><text x="836" y="191" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">hook 2</text><text x="836" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">registered #2</text><rect x="922" y="162" width="132" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="988" y="191" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">hook 1</text><text x="988" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">registered #3</text><line x1="942" y1="185" x2="980" y2="185" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><text x="958" y="232" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Execution order: 3 → 2 → 1</text><text x="594" y="268" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Registered first, torn down last -- same as construction order.</text><text x="594" y="290" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Measured: hook 3 → hook 2 → hook 1</text><rect x="24" y="336" width="1072" height="150" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="46" y="354" width="271.375" height="24" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="181.688" y="370.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">③ track: attach subscriptions to the VM</text><rect x="48" y="388" width="320" height="40" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.4"/><text x="64" y="413" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">source = 1</text><text x="198" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><text x="220" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#047857" text-anchor="start">tracked receives 1</text><line x1="374" y1="408" x2="392" y2="408" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="398" y="388" width="320" height="40" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="414" y="413" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">tracked VM destroyed</text><text x="548" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><text x="570" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="start">subscriptions drop</text><line x1="724" y1="408" x2="742" y2="408" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="748" y="388" width="320" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="764" y="413" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">source = 2</text><text x="898" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><text x="920" y="413" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">no output after destruction</text><text x="48" y="462" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">After track you do not keep the Subscription yourself -- the VM owns it.</text><rect x="24" y="509" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="525" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 13  Counts and order from the real output of demos/ch13_viewmodel</text></svg>
