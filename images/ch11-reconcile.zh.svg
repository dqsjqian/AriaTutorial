<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 629" width="1120" height="629" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="629" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">reconcile：拿一份新数据去刷新列表</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">它返回的不是「变了几个」，而是「生成了几条编辑操作」</text><rect x="24" y="96" width="1072" height="186" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><rect x="48" y="128" width="200" height="52" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="148" y="157.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">当前列表  1 2 3</text><rect x="48" y="196" width="200" height="52" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="148" y="225.575" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">新数据    1 2 3 4</text><line x1="252" y1="154" x2="300" y2="168" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="252" y1="222" x2="300" y2="208" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><rect x="304" y="140" width="240" height="100" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="424" y="182.825" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">reconcile(next, key_of)</text><text x="424" y="203.7" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">按 key 对齐，而不是按内容</text><line x1="548" y1="190" x2="596" y2="190" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="608" y="152" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">产出的编辑操作</text><rect x="608" y="164" width="190" height="34" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/><text x="703" y="186" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">Insert</text><rect x="838" y="164" width="190" height="34" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/><text x="933" y="186" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Remove</text><rect x="608" y="206" width="190" height="34" rx="9" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.3"/><text x="703" y="228" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">Move</text><rect x="838" y="206" width="190" height="34" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/><text x="933" y="228" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Reset</text><text x="608" y="268" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">同一 key 但对象不同 → 也算 Replace</text><text x="24" y="310" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#475569" text-anchor="start">本章 demo 跑出来的五个场景</text><text x="48" y="330" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">场景</text><text x="300" y="330" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">调用后列表</text><text x="470" y="330" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">本次事件数</text><text x="620" y="330" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">累计计数 insert/remove/move/reset</text><line x1="24" y1="340" x2="1096" y2="340" stroke="#e2e8f0" stroke-width="1.5"/><text x="48" y="368" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">数据没变</text><text x="300" y="368" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">1 2 3</text><text x="470" y="368" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">3</text><text x="620" y="368" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">0 / 0 / 0 / 0</text><line x1="24" y1="384" x2="1096" y2="384" stroke="#e2e8f0" stroke-width="1.5"/><text x="48" y="404" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">只追加一条</text><text x="300" y="404" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">1 2 3 4</text><text x="470" y="404" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">4</text><text x="620" y="404" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">1 / 0 / 0 / 0</text><line x1="24" y1="420" x2="1096" y2="420" stroke="#e2e8f0" stroke-width="1.5"/><text x="48" y="440" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">重新排序</text><text x="300" y="440" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">4 1 3 2</text><text x="470" y="440" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">6</text><text x="620" y="440" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">1 / 0 / 2 / 0</text><line x1="24" y1="456" x2="1096" y2="456" stroke="#e2e8f0" stroke-width="1.5"/><text x="48" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">删掉两条</text><text x="300" y="476" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">4 3</text><text x="470" y="476" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">4</text><text x="620" y="476" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">1 / 2 / 2 / 0</text><line x1="24" y1="492" x2="1096" y2="492" stroke="#e2e8f0" stroke-width="1.5"/><text x="48" y="512" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">重复键</text><text x="300" y="512" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">7 7 8</text><text x="470" y="512" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">4</text><text x="620" y="512" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">4 / 2 / 2 / 1</text><rect x="760" y="497" width="66" height="21" rx="10.5" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/><text x="793" y="511.46" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">整表重建</text><text x="24" y="546" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">第一行是关键：数据没变却返回 3。这 3 条是 Replace —— 按 key 对齐后对象是新造的，所以重放一次等值更新。</text><text x="24" y="568" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">第五行是兜底：key 不唯一就无法判断谁是谁，reconcile 降级为 Reset，整表重建。</text><rect x="24" y="594" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="610" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · 第 11 章　全部数字来自 demos/ch11_reconcile 的实际运行</text></svg>
