t-anchor="middle">JNI</text><line x1="697" y1="376" x2="861" y2="376" stroke="#ddd6fe" stroke-width="1.5"/><text x="779" y="398" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">Android View</text><text x="779" y="420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">bridged via JNI</text><line x1="779" y1="334" x2="779" y2="338" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="779" y1="334" x2="779" y2="334" stroke="#cbd5e1" stroke-width="1.5"/><rect x="900" y="340" width="196" height="116" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="998" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">HTTP</text><line x1="916" y1="376" x2="1080" y2="376" stroke="#fecaca" stroke-width="1.5"/><text x="998" y="398" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">browser HTML</text><text x="998" y="420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">REST + SSE</text><line x1="998" y1="334" x2="998" y2="338" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="998" y1="334" x2="998" y2="334" stroke="#cbd5e1" stroke-width="1.5"/><line x1="122" y1="334" x2="998" y2="334" stroke="#cbd5e1" stroke-width="1.5"/><line x1="560" y1="332" x2="560" y2="334" stroke="#cbd5e1" stroke-width="1.5"/><text x="24" y="486" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Wiring is always three steps:</text><rect x="160" y="472" width="184.5" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/><text x="252.25" y="488.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">make the platform adapter</text><text x="350.5" y="490" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><rect x="360.5" y="472" width="195.125" height="24" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="458.062" y="488.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">build a BindingEngine on it</text><text x="561.625" y="490" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><rect x="571.625" y="472" width="191.375" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="667.312" y="488.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">bind widgets to Properties</text><text x="769" y="490" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">→</text><text x="24" y="542" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">You still draw the UI as before: Designer, Storyboard, Compose, HTML. The adapter translates; it does not draw.</text><text x="24" y="566" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="start">Qt6 and HTTP have full demos in this repo; the other three appear as wiring comparisons only.</text><rect x="24" y="592" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="608" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 15  Demos: demos/ch15_qt6 and demos/ch15_http</text></svg>
