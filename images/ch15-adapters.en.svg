<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 627" width="1120" height="627" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="627" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">One ViewModel, five kinds of UI</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">The adapter is the only per-platform code you write</text><rect x="350" y="110" width="420" height="62" rx="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/><text x="560" y="137" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#4f46e5" text-anchor="middle">ViewModel (plain C++)</text><text x="560" y="159" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">the business logic, once</text><line x1="560" y1="174" x2="560" y2="194" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)" stroke-dasharray="5 4"/><rect x="300" y="196" width="520" height="56" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="560" y="220" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">BindingEngine</text><text x="560" y="242" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">pushes changes to widgets and pulls user input back</text><line x1="560" y1="254" x2="560" y2="274" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)" stroke-dasharray="5 4"/><rect x="340" y="276" width="440" height="56" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="560" y="300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">IViewAdapter</text><text x="560" y="322" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">the single contract an adapter implements</text><rect x="24" y="340" width="196" height="116" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="122" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Qt6</text><line x1="40" y1="376" x2="204" y2="376" stroke="#a7f3d0" stroke-width="1.5"/><text x="122" y="398" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">Qt Widgets</text><text x="122" y="420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">draw in Designer</text><line x1="122" y1="334" x2="122" y2="338" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="122" y1="334" x2="122" y2="334" stroke="#cbd5e1" stroke-width="1.5"/><rect x="243" y="340" width="196" height="116" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/><text x="341" y="366" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,