ngFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">keep even</text><rect x="24" y="294" width="300" height="40" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="174" y="319" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">2  8  2</text><rect x="386" y="196" width="300" height="88" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><text x="536" y="233.15" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">SortedList</text><text x="536" y="257.4" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">ascending</text><rect x="386" y="294" width="300" height="40" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/><text x="536" y="319" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">2  2  4  8</text><rect x="748" y="196" width="300" height="88" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/><text x="898" y="233.15" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">PagedList</text><text x="898" y="257.4" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">2 per page</text><rect x="748" y="294" width="300" height="40" rx="9" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.2"/><text x="898" y="319" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">p0 = 2 2  p1 = 4 8</text><line x1="330" y1="240" x2="380" y2="240" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><line x1="692" y1="240" x2="742" y2="240" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m0a)"/><text x="24" y="378" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#047857" text-anchor="start">The view follows the source</text><text x="24" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">· insert an odd 7</text><line x1="250" y1="392" x2="290" y2="392" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><text x="300" y="396" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="start">evens stays 2 8 2</text><text x="24" y="434" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">· insert an even 4</text><line x1="250" y1="430" x2="290" y2="430" stroke="#047857" stroke-width="1.8" marker-end="url(#m1a)"/><text x="300" y="434" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="start">evens becomes 2 8 2 4</text><text x="24" y="472" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">· change the source</text><line x1="250" y1="468" x2="290" y2="468" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m2a)"/><text x="300" y="472" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="start">desc &amp; ≥5: 9 8 → 100 9</text><rect x="24" y="526" width="524" height="62" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="46" y="552" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start">A view: each downstream node stores nothing extra</text><text x="46" y="574" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">One incremental cost per source change</text><rect x="572" y="526" width="524" height="62" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="594" y="552" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">A copy: every layer materialises a new container</text><text x="594" y="574" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Longer chains mean N full rebuilds per change</text><rect x="24" y="611" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="627" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 10  List contents from the real output of demos/ch10_derived</text></svg>
