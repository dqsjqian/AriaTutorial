<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 682" width="1120" height="682" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="m0a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#047857"/></marker><marker id="m1a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#b91c1c"/></marker><marker id="m2a" viewBox="0 0 8 7" refX="7.4" refY="3.5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L0,7 L8,3.5 z" fill="#cbd5e1"/></marker></defs><rect x="0" y="0" width="1120" height="682" fill="#ffffff"/><rect x="24" y="13" width="5" height="26" rx="2.5" fill="#4f46e5" stroke="none" stroke-width="0"/><text x="40" y="34" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start">Two ways to wait for a result, one of which crashes</text><text x="40" y="59" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Below: measured concurrency timing, and the direction cancellation propagates</text><text x="24" y="92" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="start">① Where blocking_get is allowed</text><rect x="24" y="104" width="524" height="176" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="46" y="136" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">Synchronous body: take it directly</text><text x="46" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#334155" text-anchor="start">auto t = square(7);  t.blocking_get()</text><text x="46" y="190" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Measured: square(7) = 49</text><text x="46" y="218" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">The body only co_returns; no thread change happens,</text><text x="46" y="238" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">so the value is already there.</text><text x="46" y="264" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="start">→ the official tests use this pattern</text><rect x="572" y="104" width="524" height="176" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="594" y="136" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Real async: you must wait properly</text><text x="594" y="164" font-family="'Cascadia Mono','Consolas','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="400" fill="#334155" text-anchor="start">task.start_detached()  +  轮询标志</text><text x="594" y="190" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Measured: square_on_pool(9) = 81</text><text x="594" y="218" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Once schedule_on is inside the body, blocking_get</text><text x="594" y="238" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">waits for work that will never finish on this thread.</text><text x="594" y="264" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">Symptom: the process dies with 0xC0000409</text><text x="24" y="314" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5" text-anchor="start">② when_all: wait on three tasks at once</text><rect x="24" y="326" width="1072" height="152" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/><text x="46" y="356" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">three tasks, 60 ms each</text><rect x="300" y="348" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="359.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t1  ·  60ms</text><rect x="300" y="368" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="379.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t2  ·  60ms</text><rect x="300" y="388" width="170" height="15" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/><text x="308" y="399.5" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#4f46e5" text-anchor="start">t3  ·  60ms</text><text x="484" y="360" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">all three occupy the same wall-clock span</text><line x1="300" y1="418" x2="810" y2="418" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="824" y="422" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">reference: about 180 ms serially</text><line x1="300" y1="436" x2="486" y2="436" stroke="#047857" stroke-width="1.8" marker-end="url(#m0a)"/><text x="496" y="441" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start">measured total 62 ms</text><text x="46" y="462" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">1² + 2² + 3² = 14 -- results come back in order, not in completion order.</text><text x="24" y="500" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b45309" text-anchor="start">③ Cancellation: tokens form a tree, not a global switch</text><rect x="24" y="512" width="1072" height="112" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><rect x="60" y="548" width="150" height="44" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="135" y="573.438" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">parent</text><rect x="340" y="540" width="160" height="36" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="420" y="561.025" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">child</text><rect x="340" y="586" width="160" height="36" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/><text x="420" y="607.025" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">another child</text><line x1="214" y1="564" x2="336" y2="558" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m1a)"/><line x1="214" y1="576" x2="336" y2="604" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#m2a)"/><text x="520" y="558" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">cancel a child → child true, parent stays false</text><text x="520" y="604" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="start">cancel the parent → propagates to every child</text><rect x="24" y="647" width="1072" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="0"/><text x="24" y="663" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">AriaTutorial · Chapter 17  Timing and results measured locally by demos/ch17_async</text></svg>
