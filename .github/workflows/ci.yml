name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demos:
    name: Build & run all demos (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang-19' }}

      - name: Verify dependency selection and fetch safety
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Fetch locked Aria
        run: python3 tools/ci/fetch_aria.py

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc-14' || 'clang-19' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang++-19' }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DARIA_ROOT=${{ github.workspace }}/build/deps/aria

      - name: Build
        run: cmake --build build -j

      - name: Run all demos
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 30

  windows-sdk:
    name: Installed shared SDK (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify dependency selection and fetch safety
        run: python -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Fetch locked Aria
        run: python tools/ci/fetch_aria.py
      - name: Build and install shared SDK
        run: |
          cmake -S build/deps/aria -B build/sdk-build -DARIA_BUILD_TESTS=OFF -DARIA_BUILD_BENCHMARK=OFF -DARIA_BUILD_SHARED=ON "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/sdk-build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/sdk-build --config Release
      - name: Build installed-SDK demos
        run: |
          cmake -S . -B build/installed-sdk -DARIA_ROOT= -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/installed-sdk --config Release --parallel 3
      - name: Run with deployed runtime DLLs
        run: ctest --test-dir build/installed-sdk -C Release --output-on-failure --no-tests=error --timeout 30
