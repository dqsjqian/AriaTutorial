name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demos:
    name: Build & run all demos (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev \
            ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang-19' }}

      - name: Verify dependency selection and fetch safety
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Fetch locked Aria
        run: python3 scripts/ci/fetch_aria.py

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc-14' || 'clang-19' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang++-19' }}
        run: >
          python3 scripts/build.py --configure-only --build-dir build --generator Ninja --test --all-demos
          --aria-root=${{ github.workspace }}/build/deps/aria

      - name: Build
        run: cmake --build build -j

      - name: Run all demos
        run: |
          ctest --test-dir build --show-only=json-v1 > build/demo-tests.json
          python3 -c "import json; names = {t['name'] for t in json.load(open('build/demo-tests.json'))['tests']}; assert {'ch15_qt6', 'ch15_http'} <= names, names"
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 30

  windows-sdk:
    name: Installed shared SDK (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify dependency selection and fetch safety
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Fetch locked Aria
        run: python scripts/ci/fetch_aria.py
      - name: Build and install shared SDK
        run: |
          cmake -S build/deps/aria -B build/sdk-build -DARIA_BUILD_TESTS=OFF -DARIA_BUILD_BENCHMARK=OFF -DARIA_BUILD_SHARED=ON "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/sdk-build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/sdk-build --config Release
      - name: Build installed-SDK demos and run with deployed runtime DLLs
        run: python scripts/build.py --aria-prefix "${{ github.workspace }}/build/sdk" --build-dir build/installed-sdk --test --jobs 3
